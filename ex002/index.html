<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paragrafos</title>
</head>
<body>
    <h1>Paragrafos e quebra de linhas</h1>
    <hr>
    <p>O que importa
        no HTML é a 
        marcação, não
        importa como
        voce escreve
        o importa é
        as tags <br>
        por isso é uma
        linguagem de 
        marcação
        &lt;p&gt; &lt;/p&gt; <!--LT: less than; GT: greater than-->
    </p> <br>
    <p>Agora tem a quebra de linhas</p>
    <p>Vamos adicionar alguns simbolos especiais
    &reg;
    &copy;
    &trade;
    &euro;
    &pound;
    &yen;
    &cent;
    &Delta;
    &UpArrow;

    </p>
    <p>Vamos adicionar alguns emojis:
        &#x1F596;&#x1F3FB;
        &#x1F319;
    </p>
</body>
</html>
