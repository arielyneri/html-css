    <title>Videos com HTML5</title>

<body>

     <iframe width="560" height="315" src="https://www.youtube.com/embed/j-RpvIuazmc?si=YK36VaaJ4W1vlNuQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
