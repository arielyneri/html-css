<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes com Google Fonts</title>
    <style>
       @import url('https://fonts.googleapis.com/css2?family=Black+Ops+One&display=swap');
        
        @import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap');

        body {
            font-family: "Black Ops One", system-ui;
            font-weight: 400;
            font-style: normal;
        }
        p {
            font-family: "Roboto Mono", monospace;
            font-optical-sizing: auto;
            font-weight: 400;
            font-style: normal;
        }
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Accusantium sunt officia, amet earum similique voluptas ea sapiente. Inventore quidem illo quae enim saepe cumque adipisci assumenda, voluptatibus quisquam ipsa facilis?</p>
</body>
</html>
