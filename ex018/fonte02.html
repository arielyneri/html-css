<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fontes Externas</title>
    <style>
        @font-face {
            font-family: 'London';
            src: url('font/Olondona.otf') format(opentype), url('OldLondon.ttf') format(truetype);
            font-weight: normal;
        }
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        h1 {
            font-family: 'London', Times, serif;
            font-size: 3em;
            font-weight: normal;
        }
    </style>
</head>
<body>
    <h1>Título</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Voluptatum magnam quasi aperiam vero nobis architecto sunt fuga. Autem delectus facere at. Veritatis veniam enim provident perferendis reiciendis saepe laborum est!</p>
</body>
</html>
